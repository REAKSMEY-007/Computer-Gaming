<button
  type="button"
  class="theme-toggle"
  role="switch"
  [attr.aria-checked]="themeService.isDark"
  [attr.aria-label]="themeService.isDark ? 'Switch to light mode' : 'Switch to dark mode'"
  [title]="themeService.isDark ? 'Switch to light mode' : 'Switch to dark mode'"
  (click)="themeService.toggle()"
>
  <span class="theme-track">
    <span class="theme-icon theme-icon-sun" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5m0 15V21M3 12h1.5m15 0H21M5.64 5.64l1.06 1.06m10.72 10.72 1.06 1.06M17.25 12a5.25 5.25 0 1 1-10.5 0 5.25 5.25 0 0 1 10.5 0Z" />
      </svg>
    </span>
    <span class="theme-icon theme-icon-moon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
    </svg>
    </span>
    <span class="theme-knob" [class.theme-knob-on]="themeService.isDark"></span>
  </span>
</button>
